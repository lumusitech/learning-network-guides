# =============================================================================
# LAB 02: Spanning Tree (STP / Root Bridge) y Agregación LACP 802.3ad (Bonding)
# =============================================================================
# Uso:
#   docker compose -f labs/docker-compose.lab02-stp-and-lacp.yml up -d
#   docker exec -it lab02-sw-core sh
#   docker exec -it lab02-sw-acceso sh
# =============================================================================

services:
  sw-core:
    image: alpine:3.20
    container_name: lab02-sw-core
    hostname: sw-core
    cap_add:
      - NET_ADMIN
    networks:
      link1:
        ipv4_address: 172.31.1.2
      link2:
        ipv4_address: 172.31.2.2
    command: >
      sh -c "
        apk add --no-cache iproute2 bridge iputils-ping tcpdump &&
        ip link add name br0 type bridge stp_state 1 priority 4096 forward_delay 400 &&
        ip link set dev br0 up &&
        ip addr add 10.1.99.1/24 dev br0 &&
        echo '=== SW-CORE (Root Bridge Priority 4096) LISTO ===' &&
        tail -f /dev/null
      "

  sw-acceso:
    image: alpine:3.20
    container_name: lab02-sw-acceso
    hostname: sw-acceso
    cap_add:
      - NET_ADMIN
    networks:
      link1:
        ipv4_address: 172.31.1.3
      link2:
        ipv4_address: 172.31.2.3
    command: >
      sh -c "
        apk add --no-cache iproute2 bridge iputils-ping tcpdump &&
        ip link add name br0 type bridge stp_state 1 priority 32768 forward_delay 400 &&
        ip link set dev br0 up &&
        ip addr add 10.1.99.2/24 dev br0 &&
        echo '=== SW-ACCESO (Secondary Bridge Priority 32768) LISTO ===' &&
        tail -f /dev/null
      "

networks:
  link1:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24
  link2:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.2.0/24

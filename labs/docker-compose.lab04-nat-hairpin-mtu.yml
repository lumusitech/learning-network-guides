# =============================================================================
# LAB 04: Firewall Stateful, Port Forwarding (DNAT), Triángulo Roto del
#         Hairpin NAT y Agujero Negro de MTU/MSS (TCP MSS Clamping)
# =============================================================================
# Uso:
#   docker compose -f labs/docker-compose.lab04-nat-hairpin-mtu.yml up -d
#   docker exec -it lab04-fw-borde sh
#   docker exec -it lab04-pc-interna sh
#   docker exec -it lab04-cliente-externo sh
# =============================================================================

services:
  fw-borde:
    image: alpine:3.20
    container_name: lab04-fw-borde
    hostname: fw-borde
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      wan_net:
        ipv4_address: 203.0.113.2
      lan_net:
        ipv4_address: 10.1.40.254
    command: >
      sh -c "
        apk add --no-cache iproute2 iptables nftables conntrack-tools tcpdump curl &&
        (sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true) &&
        iptables -t nat -A POSTROUTING -o eth0 -j SNAT --to-source 203.0.113.2 &&
        iptables -t nat -A PREROUTING -d 203.0.113.2 -p tcp --dport 8080 -j DNAT --to-destination 10.1.40.10:8080 &&
        echo '=== FW-BORDE (WAN: 203.0.113.2 | LAN: 10.1.40.254) LISTO ===' &&
        echo 'NOTA: El Port Forwarding (203.0.113.2:8080 -> 10.1.40.10:8080) está activo,' &&
        echo '      pero AÚN NO tiene Hairpin NAT para que practiques el diagnóstico!' &&
        tail -f /dev/null
      "

  srv-web:
    image: alpine:3.20
    container_name: lab04-srv-web
    hostname: srv-web-interno
    cap_add:
      - NET_ADMIN
    networks:
      lan_net:
        ipv4_address: 10.1.40.10
    command: >
      sh -c "
        apk add --no-cache iproute2 python3 tcpdump &&
        ip route del default 2>/dev/null || true &&
        ip route add default via 10.1.40.254 &&
        mkdir -p /srv/www &&
        echo '<h1>Servidor ERP Interno (10.1.40.10:8080) - Conexion Exitosa!</h1>' > /srv/www/index.html &&
        python3 -m http.server 8080 --directory /srv/www --bind 10.1.40.10 &
        echo '=== SRV-WEB (10.1.40.10:8080 -> GW 10.1.40.254) LISTO ===' &&
        tail -f /dev/null
      "

  pc-interna:
    image: alpine:3.20
    container_name: lab04-pc-interna
    hostname: pc-oficina
    cap_add:
      - NET_ADMIN
    networks:
      lan_net:
        ipv4_address: 10.1.40.50
    command: >
      sh -c "
        apk add --no-cache iproute2 iputils-ping curl tcpdump &&
        ip route del default 2>/dev/null || true &&
        ip route add default via 10.1.40.254 &&
        echo '=== PC-OFICINA (10.1.40.50 en la misma LAN que el servidor) LISTA ===' &&
        tail -f /dev/null
      "

  cliente-externo:
    image: alpine:3.20
    container_name: lab04-cliente-externo
    hostname: cliente-4g-internet
    cap_add:
      - NET_ADMIN
    networks:
      wan_net:
        ipv4_address: 203.0.113.100
    command: >
      sh -c "
        apk add --no-cache iproute2 iputils-ping curl tcpdump &&
        echo '=== CLIENTE-4G-EXTERNO (203.0.113.100 en Internet) LISTO ===' &&
        tail -f /dev/null
      "

networks:
  wan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 203.0.113.0/24
  lan_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.40.0/24

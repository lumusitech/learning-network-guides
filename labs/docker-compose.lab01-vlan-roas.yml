# =============================================================================
# LAB 01: VLANs 802.1Q (Access, Trunk, PVID) + Router-on-a-Stick (ROAS)
# =============================================================================
# Uso:
#   docker compose -f labs/docker-compose.lab01-vlan-roas.yml up -d
#   docker exec -it lab01-switch sh
#   docker exec -it lab01-router sh
#   docker exec -it lab01-pc-vlan10 sh
# =============================================================================

services:
  router:
    image: alpine:3.20
    container_name: lab01-router
    hostname: rtr-borde
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      trunk_link:
        ipv4_address: 172.30.1.2
    command: >
      sh -c "
        apk add --no-cache iproute2 iputils-ping tcpdump iptables &&
        (sysctl -w net.ipv4.ip_forward=1 2>/dev/null || true) &&
        ip link add link eth0 name eth0.10 type vlan id 10 &&
        ip addr add 10.1.10.1/24 dev eth0.10 &&
        ip link set dev eth0.10 up &&
        ip link add link eth0 name eth0.20 type vlan id 20 &&
        ip addr add 10.1.20.1/24 dev eth0.20 &&
        ip link set dev eth0.20 up &&
        echo '=== RTR-BORDE (ROAS VLAN 10 y VLAN 20) LISTO ===' &&
        tail -f /dev/null
      "

  switch:
    image: alpine:3.20
    container_name: lab01-switch
    hostname: sw-acceso
    cap_add:
      - NET_ADMIN
    networks:
      trunk_link:
        ipv4_address: 172.30.1.3
      port_vlan10:
        ipv4_address: 172.30.10.2
      port_vlan20:
        ipv4_address: 172.30.20.2
    command: >
      sh -c "
        apk add --no-cache iproute2 bridge iputils-ping tcpdump &&
        ip link add name br0 type bridge vlan_filtering 1 &&
        ip link set dev br0 up &&
        echo '=== SW-ACCESO (Bridge VLAN Filtering) LISTO ===' &&
        tail -f /dev/null
      "

  pc-vlan10:
    image: alpine:3.20
    container_name: lab01-pc-vlan10
    hostname: pc-staff-vlan10
    cap_add:
      - NET_ADMIN
    networks:
      trunk_link:
        ipv4_address: 172.30.1.10
    command: >
      sh -c "
        apk add --no-cache iproute2 iputils-ping tcpdump curl &&
        ip link add link eth0 name eth0.10 type vlan id 10 &&
        ip addr add 10.1.10.50/24 dev eth0.10 &&
        ip link set dev eth0.10 up &&
        ip route del default 2>/dev/null || true &&
        ip route add default via 10.1.10.1 dev eth0.10 &&
        echo '=== PC-STAFF (VLAN 10: 10.1.10.50/24 -> GW 10.1.10.1) LISTA ===' &&
        tail -f /dev/null
      "

  srv-vlan20:
    image: alpine:3.20
    container_name: lab01-srv-vlan20
    hostname: srv-erp-vlan20
    cap_add:
      - NET_ADMIN
    networks:
      trunk_link:
        ipv4_address: 172.30.1.20
    command: >
      sh -c "
        apk add --no-cache iproute2 iputils-ping tcpdump python3 &&
        ip link add link eth0 name eth0.20 type vlan id 20 &&
        ip addr add 10.1.20.10/24 dev eth0.20 &&
        ip link set dev eth0.20 up &&
        ip route del default 2>/dev/null || true &&
        ip route add default via 10.1.20.1 dev eth0.20 &&
        python3 -m http.server 8080 --bind 10.1.20.10 &
        echo '=== SRV-ERP (VLAN 20: 10.1.20.10:8080 -> GW 10.1.20.1) LISTO ===' &&
        tail -f /dev/null
      "

networks:
  trunk_link:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  port_vlan10:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  port_vlan20:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.20.0/24

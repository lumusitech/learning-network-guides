# =============================================================================
# LAB 03: Enrutamiento Dinámico OSPFv2 (Consola Cisco-like vtysh con FRRouting)
#         y Diagnóstico de Falla ExStart por MTU + Failover de Enlaces
# =============================================================================
# Uso:
#   docker compose -f labs/docker-compose.lab03-ospf-and-vrrp.yml up -d
#   docker exec -it lab03-rtr1 vtysh
#   docker exec -it lab03-rtr2 vtysh
#   docker exec -it lab03-rtr3 vtysh
# =============================================================================

services:
  rtr1:
    image: alpine:3.20
    container_name: lab03-rtr1
    hostname: rtr1-central
    privileged: true
    networks:
      p2p_r1_r2:
        ipv4_address: 10.0.255.1
      p2p_r1_r3:
        ipv4_address: 10.0.255.17
    command: >
      sh -c "
        apk add --no-cache frr iproute2 iputils-ping tcpdump &&
        sed -i 's/^ospfd=no/ospfd=yes/' /etc/frr/daemons &&
        sysctl -w net.ipv4.ip_forward=1 &&
        ip addr add 10.0.0.1/32 dev lo &&
        ip addr add 10.1.10.1/24 dev lo &&
        /usr/lib/frr/frrinit.sh start &&
        vtysh -c 'configure terminal' -c 'interface eth0' -c 'ip ospf network point-to-point' -c 'ip ospf cost 10' -c 'exit' -c 'interface eth1' -c 'ip ospf network point-to-point' -c 'ip ospf cost 10' -c 'exit' -c 'router ospf' -c 'ospf router-id 10.0.0.1' -c 'passive-interface lo' -c 'network 10.0.0.1/32 area 0' -c 'network 10.1.10.0/24 area 0' -c 'network 10.0.255.0/24 area 0' -c 'end' -c 'write memory' &&
        echo '=== RTR1-CENTRAL (OSPF Router-ID 10.0.0.1) LISTO ===' &&
        tail -f /dev/null
      "

  rtr2:
    image: alpine:3.20
    container_name: lab03-rtr2
    hostname: rtr2-sucursal
    privileged: true
    networks:
      p2p_r1_r2:
        ipv4_address: 10.0.255.2
      p2p_r2_r3:
        ipv4_address: 10.0.255.10
    command: >
      sh -c "
        apk add --no-cache frr iproute2 iputils-ping tcpdump &&
        sed -i 's/^ospfd=no/ospfd=yes/' /etc/frr/daemons &&
        sysctl -w net.ipv4.ip_forward=1 &&
        ip addr add 10.0.0.2/32 dev lo &&
        ip addr add 10.2.10.1/24 dev lo &&
        /usr/lib/frr/frrinit.sh start &&
        vtysh -c 'configure terminal' -c 'interface eth0' -c 'ip ospf network point-to-point' -c 'ip ospf cost 10' -c 'exit' -c 'interface eth1' -c 'ip ospf network point-to-point' -c 'ip ospf cost 100' -c 'exit' -c 'router ospf' -c 'ospf router-id 10.0.0.2' -c 'passive-interface lo' -c 'network 10.0.0.2/32 area 0' -c 'network 10.2.10.0/24 area 0' -c 'network 10.0.255.0/24 area 0' -c 'end' -c 'write memory' &&
        echo '=== RTR2-SUCURSAL (OSPF Router-ID 10.0.0.2) LISTO ===' &&
        tail -f /dev/null
      "

  rtr3:
    image: alpine:3.20
    container_name: lab03-rtr3
    hostname: rtr3-datacenter
    privileged: true
    networks:
      p2p_r1_r3:
        ipv4_address: 10.0.255.18
      p2p_r2_r3:
        ipv4_address: 10.0.255.11
    command: >
      sh -c "
        apk add --no-cache frr iproute2 iputils-ping tcpdump &&
        sed -i 's/^ospfd=no/ospfd=yes/' /etc/frr/daemons &&
        sysctl -w net.ipv4.ip_forward=1 &&
        ip addr add 10.0.0.3/32 dev lo &&
        ip addr add 10.3.40.1/24 dev lo &&
        /usr/lib/frr/frrinit.sh start &&
        vtysh -c 'configure terminal' -c 'interface eth0' -c 'ip ospf network point-to-point' -c 'ip ospf cost 10' -c 'exit' -c 'interface eth1' -c 'ip ospf network point-to-point' -c 'ip ospf cost 100' -c 'exit' -c 'router ospf' -c 'ospf router-id 10.0.0.3' -c 'passive-interface lo' -c 'network 10.0.0.3/32 area 0' -c 'network 10.3.40.0/24 area 0' -c 'network 10.0.255.0/24 area 0' -c 'end' -c 'write memory' &&
        echo '=== RTR3-DATACENTER (OSPF Router-ID 10.0.0.3) LISTO ===' &&
        tail -f /dev/null
      "

networks:
  p2p_r1_r2:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.255.0/29
          gateway: 10.0.255.6
  p2p_r2_r3:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.255.8/29
          gateway: 10.0.255.14
  p2p_r1_r3:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.255.16/29
          gateway: 10.0.255.22
